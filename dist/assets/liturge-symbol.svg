<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradiente Dourado Solar Liturge -->
    <linearGradient id="liturge-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="35%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Aura Radiante do Hub Central -->
    <radialGradient id="liturge-hub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>

    <!-- Filtro de Glow Sutil para Telões e Palco -->
    <filter id="liturge-stellar-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#liturge-stellar-filter)">
    <!-- OS 8 FEIXES DE CONVERGÊNCIA DIRETA AO CENTRO (100, 100) -->
    <!-- 1. Louvor & Músicos: DISTANTE (d=92px) -> (30, 41) -->
    <line x1="30" y1="41" x2="100" y2="100" stroke="url(#liturge-gold)" stroke-width="2.6" stroke-linecap="round" />

    <!-- 2. Pastoral & Palavra: MÉDIO-LONGO (d=78px) -> (127, 27) -->
    <line x1="127" y1="27" x2="100" y2="100" stroke="url(#liturge-gold)" stroke-width="2.5" stroke-linecap="round" />

    <!-- 3. Intercessão / Altar: MUITO PRÓXIMO (d=38px) -> (133, 81) -->
    <line x1="133" y1="81" x2="100" y2="100" stroke="url(#liturge-gold)" stroke-width="3.0" stroke-linecap="round" />

    <!-- 4. Transmissão & Mídia Externa: MUITO DISTANTE (d=96px) -> (188, 125) -->
    <line x1="188" y1="125" x2="100" y2="100" stroke="url(#liturge-gold)" stroke-width="2.0" stroke-linecap="round" />

    <!-- 5. Projeção & Telão: MÉDIO (d=62px) -> (136, 151) -->
    <line x1="136" y1="151" x2="100" y2="100" stroke="url(#liturge-gold)" stroke-width="2.3" stroke-linecap="round" />

    <!-- 6. Iluminação & Cenas: LONGO (d=88px) -> (77, 185) -->
    <line x1="77" y1="185" x2="100" y2="100" stroke="url(#liturge-gold)" stroke-width="1.8" stroke-linecap="round" />

    <!-- 7. Infantil & Próxima Geração: MÉDIO-CURTO (d=52px) -> (57, 130) -->
    <line x1="57" y1="130" x2="100" y2="100" stroke="url(#liturge-gold)" stroke-width="2.1" stroke-linecap="round" />

    <!-- 8. Técnica & Áudio: MUITO PRÓXIMO (d=36px) -> (65, 91) -->
    <line x1="65" y1="91" x2="100" y2="100" stroke="url(#liturge-gold)" stroke-width="3.2" stroke-linecap="round" />

    <!-- OS 8 PONTOS ESTELARES ESPALHADOS (DISTÂNCIAS E GRANDEZAS VARIADAS) -->
    <!-- Ponto 1: Louvor & Músicos (d=92px, r=6.2 - Magnitude Grande) -->
    <circle cx="30" cy="41" r="6.2" fill="#FDE047" />
    <circle cx="30" cy="41" r="2.8" fill="#FFFFFF" />

    <!-- Ponto 2: Pastoral & Palavra (d=78px, r=5.8 - Magnitude Grande) -->
    <circle cx="127" cy="27" r="5.8" fill="#FEF08A" />
    <circle cx="127" cy="27" r="2.6" fill="#FFFFFF" />

    <!-- Ponto 3: Intercessão / Altar (d=38px, r=4.8 - Magnitude Média, Próxima) -->
    <circle cx="133" cy="81" r="4.8" fill="#FBBF24" />
    <circle cx="133" cy="81" r="2.2" fill="#FFFFFF" />

    <!-- Ponto 4: Transmissão (d=96px, r=4.0 - Magnitude Média-pequena, Distante) -->
    <circle cx="188" cy="125" r="4.0" fill="#F59E0B" />
    <circle cx="188" cy="125" r="1.8" fill="#FFFFFF" />

    <!-- Ponto 5: Projeção & Telão (d=62px, r=5.0 - Magnitude Média) -->
    <circle cx="136" cy="151" r="5.0" fill="#F59E0B" />
    <circle cx="136" cy="151" r="2.2" fill="#FFFFFF" />

    <!-- Ponto 6: Iluminação Cênica (d=88px, r=3.2 - Magnitude Pequena, Distante) -->
    <circle cx="77" cy="185" r="3.2" fill="#D97706" />
    <circle cx="77" cy="185" r="1.4" fill="#FFFFFF" />

    <!-- Ponto 7: Ministério Infantil (d=52px, r=3.6 - Magnitude Pequena-média) -->
    <circle cx="57" cy="130" r="3.6" fill="#D97706" />
    <circle cx="57" cy="130" r="1.6" fill="#FFFFFF" />

    <!-- Ponto 8: Áudio & Som (d=36px, r=5.4 - Magnitude Média-grande, Próxima) -->
    <circle cx="65" cy="91" r="5.4" fill="#FDE047" />
    <circle cx="65" cy="91" r="2.4" fill="#FFFFFF" />

    <!-- O PONTO CENTRAL: O CULTO / ALTAR / LITURGE (MAIOR E MAIS BRILHANTE) -->
    <!-- Aura de dispersão luminosa -->
    <circle cx="100" cy="100" r="30" fill="url(#liturge-hub-glow)" />

    <!-- Estrela Radiante de 4 Pontas Curvadas (Stella Polaris / Sparkle) -->
    <path d="M 100,72 Q 100,100 128,100 Q 100,100 100,128 Q 100,100 72,100 Q 100,100 100,72 Z" 
          fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" />

    <!-- Núcleo solar branco puro -->
    <circle cx="100" cy="100" r="4.5" fill="#FFFFFF" />
  </g>
</svg>
