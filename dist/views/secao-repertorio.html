<div id="secao-repertorio" class="hidden space-y-4 animate-fade-in">
    <!-- Barra Superior Minimalista de Busca e Ações -->
    <div class="space-y-3">
        <div class="flex items-center gap-2 sm:gap-3">
            <!-- Campo de Busca Minimalista com Lupa -->
            <div class="relative flex-1">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <input type="text" id="searchInput" placeholder="Pesquisar música ou artista..."
                    onkeyup="filtrarMusicas()"
                    class="w-full pl-10 pr-10 py-2.5 sm:py-3 rounded-2xl bg-white dark:bg-night-900/90 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 font-sans text-xs sm:text-sm shadow-sm transition">
                <button type="button" id="btn-limpar-busca-repertorio" onclick="limparBuscaRepertorio()"
                    class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer"
                    title="Limpar pesquisa">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line></svg>
                </button>
            </div>

            <!-- Botão Discreto de Filtros Rápidos -->
            <div class="relative">
                <button type="button" id="btn-toggle-filtros-repertorio" onclick="toggleMenuFiltrosRepertorio()"
                    class="px-3 sm:px-3.5 py-2.5 sm:py-3 rounded-2xl bg-white dark:bg-night-900/90 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 hover:border-brand-500/40 transition flex items-center gap-1.5 text-xs sm:text-sm font-semibold shadow-sm cursor-pointer active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                    <span class="hidden sm:inline">Filtros</span>
                    <span id="filtro-ativo-dot" class="hidden w-2 h-2 rounded-full bg-brand-500"></span>
                </button>

                <!-- Dropdown Flutuante de Filtros -->
                <div id="dropdown-filtros-repertorio" class="hidden absolute right-0 mt-2 w-56 rounded-2xl bg-white dark:bg-night-900 border border-slate-200 dark:border-slate-800 shadow-xl p-2 z-30 space-y-1 animate-fade-in">
                    <div class="px-2.5 py-1.5 text-[10px] font-bold uppercase tracking-wider text-slate-400 border-b border-slate-100 dark:border-slate-800">
                        Filtrar por recurso
                    </div>
                    <button type="button" onclick="selecionarFiltroRepertorio('todas')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-semibold flex items-center justify-between transition hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-200 cursor-pointer">
                        <span>Todas as Músicas</span>
                        <span id="check-filtro-todas" class="text-brand-500">✓</span>
                    </button>
                    <button type="button" onclick="selecionarFiltroRepertorio('com_vs')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-semibold flex items-center justify-between transition hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-200 cursor-pointer">
                        <span>🎵 Com Áudio / VS</span>
                        <span id="check-filtro-com_vs" class="hidden text-brand-500">✓</span>
                    </button>
                    <button type="button" onclick="selecionarFiltroRepertorio('com_cifra')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-semibold flex items-center justify-between transition hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-200 cursor-pointer">
                        <span>🎸 Com Cifra</span>
                        <span id="check-filtro-com_cifra" class="hidden text-brand-500">✓</span>
                    </button>
                    <button type="button" onclick="selecionarFiltroRepertorio('com_yt')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-semibold flex items-center justify-between transition hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-200 cursor-pointer">
                        <span>📺 Com YouTube</span>
                        <span id="check-filtro-com_yt" class="hidden text-brand-500">✓</span>
                    </button>
                    <button type="button" onclick="selecionarFiltroRepertorio('com_letra')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-semibold flex items-center justify-between transition hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-200 cursor-pointer">
                        <span>📜 Com Letra</span>
                        <span id="check-filtro-com_letra" class="hidden text-brand-500">✓</span>
                    </button>
                </div>
            </div>

            <!-- Botão Admin de Criar Música -->
            <button type="button" id="btn-admin-nova-musica-repertorio" onclick="abrirModalNovaMusicaAdmin()"
                class="hidden px-3.5 py-2.5 sm:py-3 rounded-2xl text-xs sm:text-sm font-bold bg-brand-500 hover:bg-brand-400 text-night-950 transition flex items-center gap-1.5 cursor-pointer shadow-sm shadow-brand-500/20 shrink-0 active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span class="hidden sm:inline">Nova Música</span>
            </button>
        </div>

        <!-- Barra Informativa: Contagem de Músicas e Filtro Ativo -->
        <div class="flex items-center justify-between px-1 text-xs text-slate-500 dark:text-slate-400">
            <div class="flex items-center gap-2">
                <span id="repertorio-contador-total" class="font-mono font-medium">Carregando catálogo...</span>
                <span id="filtro-badge-nome" class="hidden text-[10px] px-2 py-0.5 rounded-full font-bold bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-500/20"></span>
            </div>
            <div class="text-[11px] text-slate-400">
                Toque na música para abrir cifra e áudio
            </div>
        </div>
    </div>

    <!-- Lista de Músicas no Padrão Streaming Compacto -->
    <div id="musicList" class="space-y-2">
        <div class="text-center text-slate-400 dark:text-slate-500 py-16 flex flex-col items-center justify-center gap-3">
            <div class="w-8 h-8 rounded-full border-2 border-brand-500/30 border-t-brand-500 animate-spin"></div>
            <span class="text-xs sm:text-sm font-medium">Carregando acervo de músicas...</span>
        </div>
    </div>
</div>
