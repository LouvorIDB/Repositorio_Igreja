<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repertório - Igreja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilo para centralizar e ajustar perfeitamente o player do Google Drive */
      .drive-player-wrapper {
    position: relative;
    width: 100%;
    height: 206px;
    overflow: hidden;
    border-radius: 0.5rem;
    background-color: #1e293b;
}
.drive-player-wrapper iframe {
    position: absolute;
    top: -250px;
    left: 0;
    width: 100%;
    height: 706px;
    border: 0;
}
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Espaçamento extra grande no final para o conteúdo nunca ficar escondido -->
    <div class="container mx-auto px-4 py-8 max-w-4xl pb-60">
        <!-- Cabeçalho e Navegação -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-emerald-400">Repertório</h1>
            <p class="text-slate-400 text-sm mt-1">Organizem-se previamente para os ensaios e cultos.</p>
            
            <!-- Botões de Alternância de Abas -->
            <div class="flex justify-center gap-3 mt-6">
                <button onclick="mudarAba('cultos')" id="btn-cultos" class="px-5 py-2.5 rounded-xl font-medium text-sm transition bg-emerald-600 text-white shadow-lg">
                    📅 Próximos Cultos
                </button>
                <button onclick="mudarAba('repertorio')" id="btn-repertorio" class="px-5 py-2.5 rounded-xl font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700">
                    🎵 Lista Geral de Músicas
                </button>
            </div>
            <div class="flex justify-center mt-3">
                <button onclick="toggleComentario('form-sugestao-nova')" class="px-4 py-2 rounded-xl font-medium text-sm transition bg-slate-700 hover:bg-slate-600 text-slate-300">
                    💡 Sugerir Música Nova
                </button>
            </div>

            <div id="form-sugestao-nova" class="hidden mt-4 bg-slate-800 border border-slate-700 rounded-2xl p-4 max-w-lg mx-auto space-y-2">
                <p class="text-sm text-slate-300 font-medium">Sugerir música para o repertório geral:</p>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="sugestao-nova-autor" placeholder="Seu nome" class="sm:w-1/3 bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm text-white focus:outline-none focus:border-emerald-500">
                    <input type="text" id="sugestao-nova-texto" placeholder="Nome da música e artista" class="sm:w-2/3 bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <button onclick="enviarComentario('Repertório Geral', 'sugestao-nova-autor', 'sugestao-nova-texto', 'sugestao-nova-status', 'Sugestão de Música Nova')" class="bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2 rounded text-sm font-medium">Enviar sugestão</button>
                <p id="sugestao-nova-status" class="text-xs text-emerald-400 hidden">Sugestão enviada!</p>
            </div>
        </header>

        <!-- ABA 1: PRÓXIMOS CULTOS -->
        <div id="secao-cultos" class="space-y-6">
            <div class="text-center text-slate-500 py-10">Carregando playlists de cultos...</div>
        </div>

        <!-- ABA 2: LISTA GERAL DE MÚSICAS -->
        <div id="secao-repertorio" class="hidden space-y-4">
            <div class="mb-6">
                <input type="text" id="searchInput" placeholder="Pesquisar música no repertório geral..." onkeyup="filtrarMusicas()"
                    class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div id="musicList" class="space-y-4">
                <div class="text-center text-slate-500 py-10">Carregando repertório...</div>
            </div>
        </div>
    </div>

    <!-- Rodapé Fixo Ajustado -->
    <div class="bg-slate-800 border-t border-slate-700 px-6 py-5 fixed bottom-0 left-0 right-0 shadow-2xl z-50">
        <div class="container mx-auto max-w-4xl flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="text-center md:text-left w-full md:w-1/3">
                <span id="nowPlayingTitle" class="text-xs md:text-sm font-semibold text-emerald-300 block truncate">Nenhuma música selecionada</span>
            </div>
            <div id="playerContainer" class="w-full md:w-2/3 flex justify-center items-center">
                <span class="text-xs text-slate-400">Clique em "▶ Ouvir VS" para carregar o player.</span>
            </div>
        </div>
    </div>

    <script>
        // COLE A SUA URL DO WEB APP DO GOOGLE APPS SCRIPT AQUI
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzY7ME_zU4avoz3cyswfP1INGxyaJuMDAHxCyZtDHnLuItqNE_YhtKgYBYmO_1YJdMH/exec";
        
        let dadosGlobais = { cultos: [], repertorio: [] };

        async function carregarDados() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                dadosGlobais.cultos = data.cultos || [];
                dadosGlobais.repertorio = data.repertorio || [];

                renderizarCultos(dadosGlobais.cultos);
                renderizarRepertorio(dadosGlobais.repertorio);
            } catch (error) {
                console.error("Erro ao carregar dados:", error);
                document.getElementById('secao-cultos').innerHTML = '<p class="text-red-400 text-center">Erro ao conectar com a planilha.</p>';
            }
        }

        function mudarAba(aba) {
            const secCultos = document.getElementById('secao-cultos');
            const secRepertorio = document.getElementById('secao-repertorio');
            const btnCultos = document.getElementById('btn-cultos');
            const btnRepertorio = document.getElementById('btn-repertorio');

            if (aba === 'cultos') {
                secCultos.classList.remove('hidden');
                secRepertorio.classList.add('hidden');
                btnCultos.className = "px-5 py-2.5 rounded-xl font-medium text-sm transition bg-emerald-600 text-white shadow-lg";
                btnRepertorio.className = "px-5 py-2.5 rounded-xl font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700";
            } else {
                secRepertorio.classList.remove('hidden');
                secCultos.classList.add('hidden');
                btnRepertorio.className = "px-5 py-2.5 rounded-xl font-medium text-sm transition bg-emerald-600 text-white shadow-lg";
                btnCultos.className = "px-5 py-2.5 rounded-xl font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700";
            }
        }

        function extrairIdDrive(url) {
            if (!url) return '';
            const match1 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match1 && match1[1]) return match1[1];
            
            const match2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (match2 && match2[1]) return match2[1];
            
            return '';
        }

        function obterLinkYoutube(ytDado, nomeMusica) {
            if (!ytDado) return '';
            if (ytDado.startsWith('http://') || ytDado.startsWith('https://')) return ytDado;
            return `https://www.youtube.com/results?search_query=${encodeURIComponent(ytDado || nomeMusica)}`;
        }

        function extrairIdYoutube(url) {
    if (!url) return '';
    const match1 = url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
    if (match1) return match1[1];
    const match2 = url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
    if (match2) return match2[1];
    return '';
}

            function renderizarCultos(rows) {
    const container = document.getElementById('secao-cultos');
    container.innerHTML = '';

    let blocoAtual = null;
    let blocoEmMontagem = false;
    let htmlCultos = '';
    let contadorCard = 0;
    let contadorBloco = 0;

    for (let i = 0; i < rows.length; i++) {
        const linha = rows[i];
        const textoPrimeiraColuna = linha[0] ? linha[0].toString() : '';

        if (textoPrimeiraColuna.includes("CULTO DE")) {
            if (blocoAtual) htmlCultos += `</div></div>`;

            contadorBloco++;
            const idPlaylist = `playlist-culto-${contadorBloco}`;
            const idSeta = `seta-culto-${contadorBloco}`;
            blocoAtual = textoPrimeiraColuna;
            blocoEmMontagem = blocoAtual.toUpperCase().includes('EM MONTAGEM');

            const corHeader = blocoEmMontagem
                ? 'bg-red-900/60 hover:bg-red-900/80 border-b border-red-700/50'
                : 'bg-emerald-900/60 hover:bg-emerald-900/80 border-b border-emerald-700/50';
            const corTexto = blocoEmMontagem ? 'text-red-300' : 'text-emerald-300';

            htmlCultos += `
                <div class="bg-slate-800/80 border border-slate-700 rounded-2xl overflow-hidden shadow-md mb-3">
                    <button onclick="toggleCultoBloco('${idPlaylist}', '${idSeta}')" class="w-full flex items-center justify-between ${corHeader} px-4 py-2.5 transition text-left">
                        <h2 class="font-bold ${corTexto} text-sm uppercase tracking-wider">${blocoAtual}</h2>
                        <span id="${idSeta}" class="${corTexto} text-xs">▼</span>
                    </button>
                    <div id="${idPlaylist}" class="hidden divide-y divide-slate-700/50">
            `;

            if (blocoEmMontagem) {
                htmlCultos += `
                    <div class="p-5 text-center space-y-3">
                        <p class="text-red-400 text-sm font-medium">🚧 Incompleto — playlist em montagem</p>
                        <p class="text-slate-400 text-xs">Envie sugestões de músicas para esse culto:</p>
                        <div class="flex flex-col sm:flex-row gap-2 max-w-md mx-auto">
                            <input type="text" id="sugestao-autor-${contadorBloco}" placeholder="Seu nome" class="sm:w-1/3 bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm text-white focus:outline-none focus:border-red-500">
                            <input type="text" id="sugestao-texto-${contadorBloco}" placeholder="Nome da música sugerida" class="sm:w-2/3 bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm text-white focus:outline-none focus:border-red-500">
                        </div>
                      <button onclick="enviarComentario('${blocoAtual.replace(/'/g, "\\'")}', 'sugestao-autor-${contadorBloco}', 'sugestao-texto-${contadorBloco}', 'sugestao-status-${contadorBloco}', 'Sugestão para Culto')" class="bg-red-700 hover:bg-red-600 text-white px-4 py-2 rounded text-sm font-medium">Enviar sugestão</button>
                        <p id="sugestao-status-${contadorBloco}" class="text-xs text-emerald-400 hidden">Sugestão enviada com sucesso!</p>
                    </div>
                `;
            }
        } else if (blocoAtual && textoPrimeiraColuna.trim() !== '' && !blocoEmMontagem) {
            const musica = linha[0];
            const tom = linha[1] || '';
            const variacao = linha[2] || '';
            const vsCelular = linha[3] || ''; 
            const ytDado = linha[4] || '';   
            
            const fileId = extrairIdDrive(vsCelular);
            const linkYoutubeFinal = obterLinkYoutube(ytDado, musica);
            contadorCard++;

            htmlCultos += `
                <div class="p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 hover:bg-slate-750 transition">
                    <div>
                        <h3 class="font-bold text-white text-base">${musica}</h3>
                        <div class="flex items-center gap-2 mt-1 text-xs text-slate-400">
                            <span class="bg-slate-700 px-2 py-0.5 rounded text-emerald-300 font-semibold">Tom: ${tom} ${variacao ? '('+variacao+')' : ''}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
                        ${vsCelular ? `<button onclick="playDriveAudio('${musica.replace(/'/g, "\\'")}', '${fileId}', '${vsCelular}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1">▶ Ouvir VS</button>` : ''}
                        ${linkYoutubeFinal ? `<button onclick="playYoutubeAudio('${musica.replace(/'/g, "\\'")}', '${linkYoutubeFinal}')" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1">📺 YouTube</button>` : ''}
                        <button onclick="toggleComentario('culto-${contadorCard}')" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium transition">💬 Pedir Ajuste</button>
                    </div>
                </div>
                <div id="culto-${contadorCard}" class="hidden p-4 bg-slate-900/50 border-t border-slate-700/50 space-y-2">
                    <div class="flex gap-2">
                        <input type="text" id="autor-c-${contadorCard}" placeholder="Seu nome" class="w-1/3 bg-slate-900 border border-slate-700 px-3 py-1.5 rounded text-xs text-white focus:outline-none focus:border-emerald-500">
                        <input type="text" id="comentario-c-${contadorCard}" placeholder="Ex: Mudar tom para C..." class="w-2/3 bg-slate-900 border border-slate-700 px-3 py-1.5 rounded text-xs text-white focus:outline-none focus:border-emerald-500">
                       <button onclick="enviarComentario('${musica.replace(/'/g, "\\'")}', 'autor-c-${contadorCard}', 'comentario-c-${contadorCard}', 'status-c-${contadorCard}', 'Ajuste de Tom')" class="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1.5 rounded text-xs font-medium">Enviar</button>
                    </div>
                    <p id="status-c-${contadorCard}" class="text-xs text-emerald-400 hidden">Enviado com sucesso!</p>
                </div>
            `;
        }
    }

    if (blocoAtual) htmlCultos += `</div></div>`;
    container.innerHTML = htmlCultos || '<p class="text-center text-slate-500 py-10">Nenhum culto agendado encontrado na planilha.</p>';
}

        function renderizarRepertorio(rows) {
            const container = document.getElementById('musicList');
            container.innerHTML = '';

            for (let i = 1; i < rows.length; i++) {
                const [musica, tom, variacaoTom, vsCelular, ytDado] = rows[i]; 
                if (!musica) continue;

                const fileId = extrairIdDrive(vsCelular);
                const linkYoutubeFinal = obterLinkYoutube(ytDado, musica);
                const cardId = `rep-${i}`;

                const card = document.createElement('div');
                card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 hover:border-slate-600 transition";
                
                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div>
                            <h3 class="font-bold text-lg text-white">${musica}</h3>
                            <div class="flex items-center gap-2 mt-1 text-sm text-slate-400">
                                <span class="bg-slate-700 px-2 py-0.5 rounded text-emerald-300 font-semibold">Tom: ${tom} (${variacaoTom || 'Original'})</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
                            ${vsCelular ? `<button onclick="playDriveAudio('${musica.replace(/'/g, "\\'")}', '${fileId}', '${vsCelular}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1">▶ Ouvir VS</button>` : ''}
                            ${linkYoutubeFinal ? `<button onclick="playYoutubeAudio('${musica.replace(/'/g, "\\'")}', '${linkYoutubeFinal}')" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1">📺 YouTube</button>` : ''}
                            <button onclick="toggleComentario('${cardId}')" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition">💬 Pedir Ajuste / Tom</button>
                        </div>
                    </div>

                    <div id="${cardId}" class="hidden pt-3 border-t border-slate-700 mt-3 space-y-2">
                        <div class="flex gap-2">
                            <input type="text" id="autor-${i}" placeholder="Seu nome" class="w-1/3 bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm text-white focus:outline-none focus:border-emerald-500">
                            <input type="text" id="comentario-${i}" placeholder="Ex: Mudar tom para C..." class="w-2/3 bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm text-white focus:outline-none focus:border-emerald-500">
                            <button onclick="enviarComentario('${musica.replace(/'/g, "\\'")}', 'autor-${i}', 'comentario-${i}', 'status-${i}', 'Ajuste de Tom')" class="bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2 rounded text-sm font-medium">Enviar</button>
                        </div>
                        <p id="status-${i}" class="text-xs text-emerald-400 hidden">Solicitação enviada com sucesso!</p>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function toggleCultoBloco(idPlaylist, idSeta) {
    const playlist = document.getElementById(idPlaylist);
    const seta = document.getElementById(idSeta);
    playlist.classList.toggle('hidden');
    seta.textContent = playlist.classList.contains('hidden') ? '▼' : '▲';
}

        function toggleComentario(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function filtrarMusicas() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const rows = dadosGlobais.repertorio;
            const container = document.getElementById('musicList');
            container.innerHTML = '';

            for (let i = 1; i < rows.length; i++) {
                const [musica, tom, variacaoTom, vsCelular, ytDado] = rows[i];
                if (!musica || !musica.toLowerCase().includes(termo)) continue;

                const fileId = extrairIdDrive(vsCelular);
                const linkYoutubeFinal = obterLinkYoutube(ytDado, musica);
                const cardId = `rep-filtrado-${i}`;

                const card = document.createElement('div');
                card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 hover:border-slate-600 transition";
                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div>
                            <h3 class="font-bold text-lg text-white">${musica}</h3>
                            <div class="flex items-center gap-2 mt-1 text-sm text-slate-400">
                                <span class="bg-slate-700 px-2 py-0.5 rounded text-emerald-300 font-semibold">Tom: ${tom} (${variacaoTom || 'Original'})</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
                            ${vsCelular ? `<button onclick="playDriveAudio('${musica.replace(/'/g, "\\'")}', '${fileId}', '${vsCelular}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1">▶ Ouvir VS</button>` : ''}
                            ${linkYoutubeFinal ? `<button onclick="playYoutubeAudio('${musica.replace(/'/g, "\\'")}', '${linkYoutubeFinal}')" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1">📺 YouTube</button>` : ''}
                            <button onclick="toggleComentario('${cardId}')" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition">💬 Pedir Ajuste / Tom</button>
                        </div>
                    </div>
                    <div id="${cardId}" class="hidden pt-3 border-t border-slate-700 mt-3 space-y-2">
                        <div class="flex gap-2">
                            <input type="text" id="autor-f-${i}" placeholder="Seu nome" class="w-1/3 bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm text-white focus:outline-none focus:border-emerald-500">
                            <input type="text" id="comentario-f-${i}" placeholder="Ex: Mudar tom para C..." class="w-2/3 bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm text-white focus:outline-none focus:border-emerald-500">
                            <button onclick="enviarComentario('${musica.replace(/'/g, "\\'")}', 'autor-f-${i}', 'comentario-f-${i}', 'status-f-${i}', 'Ajuste de Tom')" class="bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2 rounded text-sm font-medium">Enviar</button>
                        </div>
                        <p id="status-f-${i}" class="text-xs text-emerald-400 hidden">Solicitação enviada com sucesso!</p>
                    </div>
                `;
                container.appendChild(card);
            }
        }
function fecharPlayer() {
    document.getElementById('nowPlayingTitle').textContent = 'Nenhuma música selecionada';
    document.getElementById('playerContainer').innerHTML = `
        <span class="text-xs text-slate-400">Clique em "▶ Ouvir VS" para carregar o player.</span>
    `;
}
        function playDriveAudio(title, fileId, rawValue) {
    const titleSpan = document.getElementById('nowPlayingTitle');
    const playerContainer = document.getElementById('playerContainer');
    
    titleSpan.textContent = `Tocando: ${title}`;

    if (fileId) {
        playerContainer.innerHTML = `
            <div class="flex items-center gap-2 w-full">
                <div class="drive-player-wrapper flex-1">
                    <iframe src="https://drive.google.com/file/d/${fileId}/preview" allow="autoplay"></iframe>
                </div>
                <button onclick="fecharPlayer()" title="Fechar player" class="shrink-0 w-7 h-7 flex items-center justify-center rounded-full bg-slate-700 hover:bg-red-600 text-slate-300 hover:text-white transition text-sm">
                    ✕
                </button>
            </div>
        `;
    } else {
        playerContainer.innerHTML = `
            <span class="text-xs text-yellow-400">Insira o link de compartilhamento completo do Drive na planilha.</span>
        `;
    }
}

        function playYoutubeAudio(title, url) {
    const videoId = extrairIdYoutube(url);
    const titleSpan = document.getElementById('nowPlayingTitle');
    const playerContainer = document.getElementById('playerContainer');

    titleSpan.textContent = `Tocando: ${title}`;

    if (videoId) {
        playerContainer.innerHTML = `
            <div class="flex items-center gap-2 w-full">
                <div class="relative w-full rounded-lg overflow-hidden bg-black" style="height: 80px;">
                    <iframe 
                        src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0" 
                        allow="autoplay; encrypted-media"
                        allowfullscreen
                        style="position:absolute; top:-80px; left:0; width:100%; height:240px; border:0;">
                    </iframe>
                </div>
                <button onclick="fecharPlayer()" title="Fechar player" class="shrink-0 w-7 h-7 flex items-center justify-center rounded-full bg-slate-700 hover:bg-red-600 text-slate-300 hover:text-white transition text-sm">
                    ✕
                </button>
            </div>
        `;
    } else {
        playerContainer.innerHTML = `
            <span class="text-xs text-yellow-400">Link do YouTube inválido ou não encontrado.</span>
        `;
    }
}

        async function enviarComentario(musica, idAutor, idTexto, idStatus, categoria = 'Ajuste de Tom') {
    const autor = document.getElementById(idAutor).value;
    const texto = document.getElementById(idTexto).value;
    const statusEl = document.getElementById(idStatus);

    if (!autor || !texto) {
        alert('Preencha seu nome e a solicitação.');
        return;
    }

    statusEl.textContent = 'Enviando...';
    statusEl.classList.remove('hidden');

    try {
        await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ musica, autor, texto, categoria })
        });

        statusEl.textContent = 'Enviado!';
        document.getElementById(idTexto).value = '';
        setTimeout(() => statusEl.classList.add('hidden'), 4000);
    } catch (error) {
        statusEl.textContent = 'Erro ao enviar.';
    }
}

        carregarDados();
    </script>
</body>
</html>
