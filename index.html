<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repertório - Igreja</title>
    <!-- Tailwind CSS para um design moderno e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-emerald-400">Repertório de Músicas</h1>
            <p class="text-slate-400 text-sm mt-1">Acompanhe as escalas, tons, ouça os áudios e envie sugestões de alteração.</p>
        </header>

        <!-- Barra de Pesquisa -->
        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="Pesquisar música..." onkeyup="filtrarMusicas()"
                class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Lista de Músicas (Gerada Dinamicamente) -->
        <div id="musicList" class="space-y-4">
            <div class="text-center text-slate-500 py-10">Carregando repertório...</div>
        </div>
    </div>

    <!-- Player de Áudio Fixo no Rodapé -->
    <div class="bg-slate-800 border-t border-slate-700 p-4 sticky bottom-0 shadow-lg z-50">
        <div class="container mx-auto max-w-4xl flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="text-center sm:text-left">
                <span id="nowPlayingTitle" class="text-sm font-medium text-slate-300 block">Nenhuma música selecionada</span>
            </div>
            <audio id="audioPlayer" controls class="w-full sm:w-96"></audio>
        </div>
    </div>

    <script>
        // COLE AQUI A SUA URL DO WEB APP DO GOOGLE APPS SCRIPT
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzBWz0l7VmM0VCO1C_XoiF3jbfiLOUtzLK70ybOSoaKtRovpPOyRgvdpKXaL_xv0ADe/exec";
        let todasAsMusicas = [];

        async function loadRepertoire() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                todasAsMusicas = data.repertorio;
                renderMusic(todasAsMusicas);
            } catch (error) {
                console.error("Erro ao carregar dados:", error);
                document.getElementById('musicList').innerHTML = '<p class="text-red-400 text-center">Erro ao carregar o repertório.</p>';
            }
        }

        function extrairIdDrive(url) {
            if (!url) return '';
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/uc?export=download&id=${match[1]}`;
            }
            return url; // Retorna o original se não for padrão Drive
        }

        function renderMusic(rows) {
            const container = document.getElementById('musicList');
            container.innerHTML = '';

            // Ignorando o cabeçalho (começa do i = 1)
            for (let i = 1; i < rows.length; i++) {
                const [musica, tom, variacaoTom, vsLink, youtubeLink] = rows[i];
                if (!musica) continue;

                const audioDireto = extrairIdDrive(vsLink);
                const cardId = `card-${i}`;

                const card = document.createElement('div');
                card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 hover:border-slate-600 transition";
                
                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div>
                            <h3 class="font-bold text-lg text-white">${musica}</h3>
                            <div class="flex items-center gap-2 mt-1 text-sm text-slate-400">
                                <span class="bg-slate-700 px-2 py-0.5 rounded text-emerald-300 font-semibold">Tom: ${tom} (${variacaoTom || 'Original'})</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
                            ${audioDireto !== '#' ? `<button onclick="playAudio('${musica.replace(/'/g, "\\'")}', '${audioDireto}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1">▶ Ouvir VS</button>` : ''}
                            <button onclick="toggleComentario('${cardId}')" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition">💬 Pedir Ajuste / Tom</button>
                        </div>
                    </div>

                    <!-- Seção Oculta de Comentários -->
                    <div id="${cardId}" class="hidden pt-3 border-t border-slate-700 mt-3 space-y-2">
                        <div class="flex gap-2">
                            <input type="text" id="autor-${i}" placeholder="Seu nome" class="w-1/3 bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm text-white focus:outline-none focus:border-emerald-500">
                            <input type="text" id="comentario-${i}" placeholder="Ex: Mudar tom para C ou abaixar 1 tom..." class="w-2/3 bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm text-white focus:outline-none focus:border-emerald-500">
                            <button onclick="enviarComentario('${musica.replace(/'/g, "\\'")}', ${i})" class="bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2 rounded text-sm font-medium">Enviar</button>
                        </div>
                        <p id="status-${i}" class="text-xs text-emerald-400 hidden">Solicitação enviada com sucesso!</p>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function toggleComentario(cardId) {
            const el = document.getElementById(cardId);
            el.classList.toggle('hidden');
        }

        function filtrarMusicas() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const filtradas = todasAsMusicas.filter((row, index) => {
                if (index === 0) return true; // Mantém o cabeçalho se filtrarmos por ele
                return row[0] && row[0].toLowerCase().includes(termo);
            });
            renderMusic(filtradas);
        }

        function playAudio(title, link) {
            const player = document.getElementById('audioPlayer');
            const titleSpan = document.getElementById('nowPlayingTitle');
            titleSpan.textContent = `Tocando: ${title}`;
            player.src = link;
            player.play();
        }

        async function enviarComentario(musica, index) {
            const autor = document.getElementById(`autor-${index}`).value;
            const texto = document.getElementById(`comentario-${index}`).value;
            const statusEl = document.getElementById(`status-${index}`);

            if (!autor || !texto) {
                alert('Por favor, preencha seu nome e o pedido de alteração.');
                return;
            }

            statusEl.textContent = 'Enviando...';
            statusEl.classList.remove('hidden');

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Necessário para chamadas POST simples no Apps Script
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ musica, autor, texto })
                });

                statusEl.textContent = 'Solicitação enviada para a planilha!';
                document.getElementById(`comentario-${index}`).value = '';
                setTimeout(() => statusEl.classList.add('hidden'), 4000);
            } catch (error) {
                console.error('Erro ao enviar:', error);
                statusEl.textContent = 'Erro ao enviar. Tente novamente.';
                statusEl.classList.add('hidden');
            }
        }

        loadRepertoire();
    </script>
</body>
</html>
