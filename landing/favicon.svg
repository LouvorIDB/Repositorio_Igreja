<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="60%" stop-color="#FFA726" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <radialGradient id="fav-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="60%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fundo Squircle Dark Noite Profunda -->
  <rect width="64" height="64" rx="14" fill="url(#fav-bg)" />
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="#FFA726" stroke-width="0.8" stroke-opacity="0.35" />

  <!-- Símbolo Otimizado para Pequenas Escalas (32px / 64px) -->
  <g transform="translate(32, 32) scale(0.24)">
    <!-- Contorno Hexagonal Externo -->
    <polygon points="0,-95 78,-48 78,48 0,95 -78,48 -78,-48" 
             stroke="url(#fav-gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

    <!-- Hexágono Interno -->
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" 
             stroke="url(#fav-gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Arestas de Conexão Radial -->
    <line x1="0" y1="0" x2="0" y2="-95" stroke="url(#fav-gold)" stroke-width="8" stroke-linecap="round" />
    <line x1="0" y1="0" x2="78" y2="-48" stroke="url(#fav-gold)" stroke-width="7" stroke-linecap="round" />
    <line x1="0" y1="0" x2="78" y2="48" stroke="url(#fav-gold)" stroke-width="7" stroke-linecap="round" />
    <line x1="0" y1="0" x2="0" y2="95" stroke="url(#fav-gold)" stroke-width="8" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-78" y2="48" stroke="url(#fav-gold)" stroke-width="7" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-78" y2="-48" stroke="url(#fav-gold)" stroke-width="7" stroke-linecap="round" />

    <!-- Cruzamentos Estelares -->
    <line x1="0" y1="-95" x2="78" y2="48" stroke="url(#fav-gold)" stroke-width="5.5" opacity="0.6" />
    <line x1="0" y1="-95" x2="-78" y2="48" stroke="url(#fav-gold)" stroke-width="5.5" opacity="0.6" />
    <line x1="0" y1="95" x2="78" y2="-48" stroke="url(#fav-gold)" stroke-width="5.5" opacity="0.6" />
    <line x1="0" y1="95" x2="-78" y2="-48" stroke="url(#fav-gold)" stroke-width="5.5" opacity="0.6" />

    <!-- Nós de Vértice Radiantes -->
    <circle cx="0" cy="-95" r="11" fill="#FFE082" />
    <circle cx="78" cy="-48" r="10" fill="#FFE082" />
    <circle cx="78" cy="48" r="10" fill="#FFE082" />
    <circle cx="0" cy="95" r="11" fill="#FFE082" />
    <circle cx="-78" cy="48" r="10" fill="#FFE082" />
    <circle cx="-78" cy="-48" r="10" fill="#FFE082" />

    <!-- Nós Internos -->
    <circle cx="0" cy="-48" r="11" fill="#FFF9C4" />
    <circle cx="42" cy="-24" r="11" fill="#FFF9C4" />
    <circle cx="42" cy="24" r="11" fill="#FFF9C4" />
    <circle cx="0" cy="48" r="11" fill="#FFF9C4" />
    <circle cx="-42" cy="24" r="11" fill="#FFF9C4" />
    <circle cx="-42" cy="-24" r="11" fill="#FFF9C4" />

    <!-- Nó Central -->
    <circle cx="0" cy="0" r="22" fill="url(#fav-glow)" />
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" />
  </g>
</svg>
