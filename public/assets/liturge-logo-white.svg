<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" width="100%" height="100%" fill="none">
  <!-- SÍMBOLO POLIÉDRICO MONOCROMÁTICO BRANCO -->
  <g transform="translate(10, 5) scale(0.4)">
    <!-- Arestas Principais -->
    <path d="M 100,22 L 148,68 L 172,62 L 148,132 L 172,138 L 100,178 L 52,132 L 28,138 L 52,68 L 28,62 Z" 
          stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

    <polygon points="100,46 148,68 148,132 100,154 52,132 52,68" 
             stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

    <polygon points="100,46 128,84 128,116 100,154 72,116 72,84" 
             stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Raios Centrais -->
    <line x1="100" y1="100" x2="100" y2="46" stroke="#FFFFFF" stroke-width="2.2" />
    <line x1="100" y1="100" x2="128" y2="84" stroke="#FFFFFF" stroke-width="2.2" />
    <line x1="100" y1="100" x2="128" y2="116" stroke="#FFFFFF" stroke-width="2.2" />
    <line x1="100" y1="100" x2="100" y2="154" stroke="#FFFFFF" stroke-width="2.2" />
    <line x1="100" y1="100" x2="72" y2="116" stroke="#FFFFFF" stroke-width="2.2" />
    <line x1="100" y1="100" x2="72" y2="84" stroke="#FFFFFF" stroke-width="2.2" />

    <!-- Arestas Externas -->
    <line x1="100" y1="22" x2="100" y2="46" stroke="#FFFFFF" stroke-width="2" />
    <line x1="100" y1="178" x2="100" y2="154" stroke="#FFFFFF" stroke-width="2" />
    <line x1="28" y1="62" x2="72" y2="84" stroke="#FFFFFF" stroke-width="1.8" />
    <line x1="172" y1="62" x2="128" y2="84" stroke="#FFFFFF" stroke-width="1.8" />
    <line x1="28" y1="138" x2="72" y2="116" stroke="#FFFFFF" stroke-width="1.8" />
    <line x1="172" y1="138" x2="128" y2="116" stroke="#FFFFFF" stroke-width="1.8" />

    <!-- Nós -->
    <circle cx="100" cy="22" r="4.5" fill="#FFFFFF" />
    <circle cx="28" cy="62" r="4" fill="#FFFFFF" />
    <circle cx="172" cy="62" r="4" fill="#FFFFFF" />
    <circle cx="28" cy="138" r="4" fill="#FFFFFF" />
    <circle cx="172" cy="138" r="4" fill="#FFFFFF" />
    <circle cx="100" cy="178" r="4.5" fill="#FFFFFF" />

    <circle cx="100" cy="46" r="5" fill="#FFFFFF" />
    <circle cx="128" cy="84" r="5" fill="#FFFFFF" />
    <circle cx="128" cy="116" r="5" fill="#FFFFFF" />
    <circle cx="100" cy="154" r="5" fill="#FFFFFF" />
    <circle cx="72" cy="116" r="5" fill="#FFFFFF" />
    <circle cx="72" cy="84" r="5" fill="#FFFFFF" />

    <!-- Nó Central -->
    <circle cx="100" cy="100" r="7.5" fill="#FFFFFF" />
  </g>

  <!-- TIPOGRAFIA: WORDMARK LITURGE -->
  <text x="108" y="47" 
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#FFFFFF">
    LITURGE
  </text>

  <!-- LINHA DIVISÓRIA -->
  <line x1="108" y1="58" x2="415" y2="58" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />

  <!-- TAGLINE DE APOIO -->
  <text x="109" y="72" 
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="8.8" 
        font-weight="600" 
        letter-spacing="2.8" 
        fill="#CBD5E1">
    GESTÃO DE ESCALAS E REPERTÓRIO
  </text>
</svg>
