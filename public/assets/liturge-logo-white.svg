<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" width="100%" height="100%" fill="none">
  <!-- SÍMBOLO DA CONSTELAÇÃO LITURGE (MONOCROMÁTICO BRANCO) -->
  <g transform="translate(10, 5) scale(0.4)">
    <!-- Feixes de Convergência ao Centro -->
    <line x1="30" y1="41" x2="100" y2="100" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity="0.8" />
    <line x1="127" y1="27" x2="100" y2="100" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <line x1="133" y1="81" x2="100" y2="100" stroke="#FFFFFF" stroke-width="3.0" stroke-linecap="round" opacity="0.9" />
    <line x1="188" y1="125" x2="100" y2="100" stroke="#FFFFFF" stroke-width="2.0" stroke-linecap="round" opacity="0.7" />
    <line x1="136" y1="151" x2="100" y2="100" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" opacity="0.75" />
    <line x1="77" y1="185" x2="100" y2="100" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
    <line x1="57" y1="130" x2="100" y2="100" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" opacity="0.75" />
    <line x1="65" y1="91" x2="100" y2="100" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" opacity="0.9" />

    <!-- 8 Nós Estelares -->
    <circle cx="30" cy="41" r="6.2" fill="#FFFFFF" />
    <circle cx="127" cy="27" r="5.8" fill="#FFFFFF" />
    <circle cx="133" cy="81" r="4.8" fill="#FFFFFF" />
    <circle cx="188" cy="125" r="4.0" fill="#FFFFFF" />
    <circle cx="136" cy="151" r="5.0" fill="#FFFFFF" />
    <circle cx="77" cy="185" r="3.2" fill="#FFFFFF" />
    <circle cx="57" cy="130" r="3.6" fill="#FFFFFF" />
    <circle cx="65" cy="91" r="5.4" fill="#FFFFFF" />

    <!-- Ponto Central Luminoso -->
    <circle cx="100" cy="100" r="28" fill="#FFFFFF" fill-opacity="0.12" />
    <path d="M 100,72 Q 100,100 128,100 Q 100,100 100,128 Q 100,100 72,100 Q 100,100 100,72 Z" 
          fill="#FFFFFF" />
  </g>

  <!-- TIPOGRAFIA: WORDMARK LITURGE BRANCO -->
  <text x="108" y="47" 
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#FFFFFF">
    LITURGE
  </text>

  <!-- LINHA DE HORIZONTE ESTELAR -->
  <line x1="108" y1="58" x2="415" y2="58" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />

  <!-- TAGLINE DE APOIO -->
  <text x="109" y="72" 
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="8.8" 
        font-weight="600" 
        letter-spacing="2.8" 
        fill="#FFFFFF"
        opacity="0.8">
    GESTÃO DE ESCALAS E REPERTÓRIO
  </text>
</svg>
