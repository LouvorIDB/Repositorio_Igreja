<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradiente Dourado Solar Liturge -->
    <linearGradient id="logo-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="35%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Aura Radiante do Hub Central -->
    <radialGradient id="logo-hub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>

    <!-- Filtro de Glow Sutil -->
    <filter id="logo-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- SÍMBOLO DA CONSTELAÇÃO LITURGE (ESQUERDA) -->
  <g transform="translate(10, 5) scale(0.4)" filter="url(#logo-glow-filter)">
    <!-- Feixes de Convergência ao Centro -->
    <line x1="30" y1="41" x2="100" y2="100" stroke="url(#logo-gold)" stroke-width="2.6" stroke-linecap="round" />
    <line x1="127" y1="27" x2="100" y2="100" stroke="url(#logo-gold)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="133" y1="81" x2="100" y2="100" stroke="url(#logo-gold)" stroke-width="3.0" stroke-linecap="round" />
    <line x1="188" y1="125" x2="100" y2="100" stroke="url(#logo-gold)" stroke-width="2.0" stroke-linecap="round" />
    <line x1="136" y1="151" x2="100" y2="100" stroke="url(#logo-gold)" stroke-width="2.3" stroke-linecap="round" />
    <line x1="77" y1="185" x2="100" y2="100" stroke="url(#logo-gold)" stroke-width="1.8" stroke-linecap="round" />
    <line x1="57" y1="130" x2="100" y2="100" stroke="url(#logo-gold)" stroke-width="2.1" stroke-linecap="round" />
    <line x1="65" y1="91" x2="100" y2="100" stroke="url(#logo-gold)" stroke-width="3.2" stroke-linecap="round" />

    <!-- 8 Nós Estelares -->
    <circle cx="30" cy="41" r="6.2" fill="#FDE047" />
    <circle cx="30" cy="41" r="2.8" fill="#FFFFFF" />

    <circle cx="127" cy="27" r="5.8" fill="#FEF08A" />
    <circle cx="127" cy="27" r="2.6" fill="#FFFFFF" />

    <circle cx="133" cy="81" r="4.8" fill="#FBBF24" />
    <circle cx="133" cy="81" r="2.2" fill="#FFFFFF" />

    <circle cx="188" cy="125" r="4.0" fill="#F59E0B" />
    <circle cx="188" cy="125" r="1.8" fill="#FFFFFF" />

    <circle cx="136" cy="151" r="5.0" fill="#F59E0B" />
    <circle cx="136" cy="151" r="2.2" fill="#FFFFFF" />

    <circle cx="77" cy="185" r="3.2" fill="#D97706" />
    <circle cx="77" cy="185" r="1.4" fill="#FFFFFF" />

    <circle cx="57" cy="130" r="3.6" fill="#D97706" />
    <circle cx="57" cy="130" r="1.6" fill="#FFFFFF" />

    <circle cx="65" cy="91" r="5.4" fill="#FDE047" />
    <circle cx="65" cy="91" r="2.4" fill="#FFFFFF" />

    <!-- Ponto Central Luminoso -->
    <circle cx="100" cy="100" r="30" fill="url(#logo-hub-glow)" />
    <path d="M 100,72 Q 100,100 128,100 Q 100,100 100,128 Q 100,100 72,100 Q 100,100 100,72 Z" 
          fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" />
    <circle cx="100" cy="100" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- TIPOGRAFIA: WORDMARK LITURGE -->
  <text x="108" y="47" 
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#FFFFFF">
    LITURGE
  </text>

  <!-- LINHA DE HORIZONTE ESTELAR -->
  <line x1="108" y1="58" x2="415" y2="58" stroke="url(#logo-gold)" stroke-width="1.2" opacity="0.4" />

  <!-- TAGLINE DE APOIO -->
  <text x="109" y="72" 
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="8.8" 
        font-weight="600" 
        letter-spacing="2.8" 
        fill="#FFA726">
    GESTÃO DE ESCALAS E REPERTÓRIO
  </text>
</svg>
