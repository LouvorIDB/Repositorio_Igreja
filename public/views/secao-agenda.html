<!-- SEÇÃO AGENDA & CALENDÁRIO DE EVENTOS DA IGREJA -->
<section id="secao-agenda" class="hidden space-y-6">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-night-900/90 border border-slate-800 p-5 rounded-2xl shadow-xl">
        <div>
            <h2 class="text-xl font-extrabold text-white flex items-center gap-2.5">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-liturge-400">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>Agenda & Calendário da Igreja</span>
            </h2>
            <p class="text-xs text-slate-400 mt-1">Confira a programação completa de cultos e eventos da nossa igreja.</p>
        </div>

        <div class="flex items-center gap-2.5 flex-wrap">
            <button id="btn-minha-disponibilidade" onclick="abrirModalDisponibilidade()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-1.5 shadow-lg shadow-emerald-950/40 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></svg>
                <span>Minha Disponibilidade</span>
            </button>

            <button id="btn-exportar-agenda-modal" onclick="abrirModalExportarCalendario()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 hover:border-liturge-500/40 text-xs font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-1.5 shadow-sm cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-liturge-400"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
                <span>Sincronizar com Celular</span>
            </button>

            <button id="btn-agenda-novo-evento" onclick="abrirModalEventoAdmin()" class="hidden bg-gradient-to-r from-liturge-500 to-amber-600 hover:from-liturge-400 hover:to-amber-500 text-night-950 text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center gap-1.5 shadow-lg shadow-liturge-500/20 cursor-pointer">
                <span>+</span> Cadastrar Novo Evento
            </button>
        </div>
    </div>

    <!-- ESTRUTURA DO CALENDÁRIO + LISTA DE PRÓXIMOS EVENTOS -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- CALENDÁRIO MENSAL (2 COLUNAS EM TELAS GRANDES) -->
        <div class="lg:col-span-2 bg-night-900/90 border border-slate-800 p-5 rounded-2xl space-y-4 shadow-xl">
            <!-- CABEÇALHO DE NAVEGAÇÃO DE MÊS -->
            <div class="flex items-center justify-between">
                <button onclick="navegarMesAgenda(-1)" class="px-3 py-1.5 bg-night-950 hover:bg-slate-800 text-slate-300 hover:text-white border border-slate-800 rounded-lg text-xs font-semibold transition cursor-pointer">
                    ← Mês Anterior
                </button>

                <h3 id="titulo-mes-ano-agenda" class="text-base font-extrabold text-liturge-400 font-mono tracking-wide">
                    Carregando Mês...
                </h3>

                <button onclick="navegarMesAgenda(1)" class="px-3 py-1.5 bg-night-950 hover:bg-slate-800 text-slate-300 hover:text-white border border-slate-800 rounded-lg text-xs font-semibold transition cursor-pointer">
                    Próximo Mês →
                </button>
            </div>

            <!-- CABEÇALHO DOS DIAS DA SEMANA -->
            <div class="grid grid-cols-7 gap-1 text-center border-b border-slate-800 pb-2">
                <span class="text-[11px] font-bold text-slate-400">Dom</span>
                <span class="text-[11px] font-bold text-slate-400">Seg</span>
                <span class="text-[11px] font-bold text-slate-400">Ter</span>
                <span class="text-[11px] font-bold text-slate-400">Qua</span>
                <span class="text-[11px] font-bold text-slate-400">Qui</span>
                <span class="text-[11px] font-bold text-slate-400">Sex</span>
                <span class="text-[11px] font-bold text-slate-400">Sáb</span>
            </div>

            <!-- GRADE DOS DIAS DO MÊS (PREENCHIDO VIA AGENDA.JS) -->
            <div id="grid-dias-calendario" class="grid grid-cols-7 gap-1.5">
                <!-- Dias inseridos dinamicamente -->
            </div>
        </div>

        <!-- PAINEL LATERAL: PRÓXIMOS EVENTOS -->
        <div class="bg-night-900/90 border border-slate-800 p-5 rounded-2xl space-y-4 shadow-xl">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-liturge-400"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                <span>Próximos Eventos Cadastrados</span>
            </h3>

            <div id="lista-eventos-proximos" class="space-y-3">
                <!-- Lista inserida dinamicamente -->
            </div>
        </div>
    </div>
</section>
