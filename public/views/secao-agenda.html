<!-- SEÇÃO AGENDA & CALENDÁRIO DE EVENTOS DA IGREJA -->
<section id="secao-agenda" class="hidden space-y-6">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900/80 border border-slate-800 p-5 rounded-2xl">
        <div>
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <span>📅</span> Agenda & Calendário da Igreja
            </h2>
            <p class="text-xs text-slate-400 mt-1">Confira a programação completa de cultos e eventos da nossa igreja.</p>
        </div>

        <button id="btn-agenda-novo-evento" onclick="abrirModalEventoAdmin()" class="hidden bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-1.5 shadow-lg">
            <span>➕</span> Cadastrar Novo Evento
        </button>
    </div>

    <!-- ESTRUTURA DO CALENDÁRIO + LISTA DE PRÓXIMOS EVENTOS -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- CALENDÁRIO MENSAL (2 COLUNAS EM TELAS GRANDES) -->
        <div class="lg:col-span-2 bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <!-- CABEÇALHO DE NAVEGAÇÃO DE MÊS -->
            <div class="flex items-center justify-between">
                <button onclick="navegarMesAgenda(-1)" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-bold transition">
                    ← Mês Anterior
                </button>

                <h3 id="titulo-mes-ano-agenda" class="text-base font-extrabold text-white">
                    Carregando Mês...
                </h3>

                <button onclick="navegarMesAgenda(1)" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-bold transition">
                    Próximo Mês →
                </button>
            </div>

            <!-- CABEÇALHO DOS DIAS DA SEMANA -->
            <div class="grid grid-cols-7 gap-1 text-center border-b border-slate-800 pb-2">
                <span class="text-[11px] font-bold text-slate-400">Dom</span>
                <span class="text-[11px] font-bold text-slate-400">Seg</span>
                <span class="text-[11px] font-bold text-slate-400">Ter</span>
                <span class="text-[11px] font-bold text-slate-400">Qua</span>
                <span class="text-[11px] font-bold text-slate-400">Qui</span>
                <span class="text-[11px] font-bold text-slate-400">Sex</span>
                <span class="text-[11px] font-bold text-slate-400">Sáb</span>
            </div>

            <!-- GRADE DOS DIAS DO MÊS (PREENCHIDO VIA AGENDA.JS) -->
            <div id="grid-dias-calendario" class="grid grid-cols-7 gap-1.5">
                <!-- Dias inseridos dinamicamente -->
            </div>
        </div>

        <!-- PAINEL LATERAL: PRÓXIMOS EVENTOS -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
                <span>🔥</span> Próximos Eventos Cadastrados
            </h3>

            <div id="lista-eventos-proximos" class="space-y-3">
                <!-- Lista inserida dinamicamente -->
            </div>
        </div>
    </div>
</section>
