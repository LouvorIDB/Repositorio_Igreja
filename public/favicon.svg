<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradiente Fundo Noite Litúrgica -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E172B" />
      <stop offset="100%" stop-color="#030611" />
    </linearGradient>

    <!-- Gradiente Dourado Solar de Alto Contraste -->
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Brilho Radial do Centro -->
    <radialGradient id="fav-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FEF08A" />
      <stop offset="75%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fundo Squircle (Ícone de App / Favicon) -->
  <rect width="64" height="64" rx="14" fill="url(#fav-bg)" />
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.35" />

  <!-- Constelação Liturge Otimizada para Pequenas Escalas (16px a 64px) -->
  <g transform="translate(32, 32) scale(0.24)">
    <!-- Feixes de Convergência (Pesos Calibrados para Legibilidade Extrema) -->
    <line x1="-70" y1="-59" x2="0" y2="0" stroke="url(#fav-gold)" stroke-width="7" stroke-linecap="round" />
    <line x1="27" y1="-73" x2="0" y2="0" stroke="url(#fav-gold)" stroke-width="7" stroke-linecap="round" />
    <line x1="33" y1="-19" x2="0" y2="0" stroke="url(#fav-gold)" stroke-width="8.5" stroke-linecap="round" />
    <line x1="88" y1="25" x2="0" y2="0" stroke="url(#fav-gold)" stroke-width="6" stroke-linecap="round" />
    <line x1="36" y1="51" x2="0" y2="0" stroke="url(#fav-gold)" stroke-width="6.5" stroke-linecap="round" />
    <line x1="-23" y1="85" x2="0" y2="0" stroke="url(#fav-gold)" stroke-width="5.5" stroke-linecap="round" />
    <line x1="-43" y1="30" x2="0" y2="0" stroke="url(#fav-gold)" stroke-width="6" stroke-linecap="round" />
    <line x1="-35" y1="-9" x2="0" y2="0" stroke="url(#fav-gold)" stroke-width="9" stroke-linecap="round" />

    <!-- 8 Nós Estelares -->
    <circle cx="-70" cy="-59" r="13" fill="#FDE047" />
    <circle cx="-70" cy="-59" r="6" fill="#FFFFFF" />

    <circle cx="27" cy="-73" r="12" fill="#FEF08A" />
    <circle cx="27" cy="-73" r="5.5" fill="#FFFFFF" />

    <circle cx="33" cy="-19" r="11" fill="#FEF08A" />
    <circle cx="33" cy="-19" r="5" fill="#FFFFFF" />

    <circle cx="88" cy="25" r="9" fill="#F59E0B" />
    <circle cx="88" cy="25" r="4" fill="#FFFFFF" />

    <circle cx="36" cy="51" r="11" fill="#F59E0B" />
    <circle cx="36" cy="51" r="5" fill="#FFFFFF" />

    <circle cx="-23" cy="85" r="8" fill="#D97706" />
    <circle cx="-23" cy="85" r="3.5" fill="#FFFFFF" />

    <circle cx="-43" cy="30" r="9" fill="#D97706" />
    <circle cx="-43" cy="30" r="4" fill="#FFFFFF" />

    <circle cx="-35" cy="-9" r="12" fill="#FDE047" />
    <circle cx="-35" cy="-9" r="5.5" fill="#FFFFFF" />

    <!-- O Ponto Central: Estrela de 4 Pontas Radiante -->
    <circle cx="0" cy="0" r="32" fill="url(#fav-glow)" />
    <path d="M 0,-30 Q 0,0 30,0 Q 0,0 0,30 Q 0,0 -30,0 Q 0,0 0,-30 Z" 
          fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
  </g>
</svg>
