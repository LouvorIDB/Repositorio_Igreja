<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #111827 0%, #0B111E 45%, #070B14 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  }
  .splash-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    z-index: 10;
  }
  .symbol-box {
    width: min(32vw, 32vh);
    height: min(32vw, 32vh);
    min-width: 140px;
    min-height: 140px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 0 35px rgba(245, 166, 35, 0.45));
    margin-bottom: min(4vh, 32px);
  }
  .symbol-box svg {
    width: 100%;
    height: 100%;
  }
  .glow-aura {
    position: absolute;
    width: 140%;
    height: 140%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.16) 0%, rgba(217, 119, 6, 0.05) 50%, transparent 75%);
    filter: blur(30px);
  }
  .brand-title {
    font-size: min(7vw, 42px);
    font-weight: 800;
    letter-spacing: 0.28em;
    color: #FFFFFF;
    margin-left: 0.28em;
    text-transform: uppercase;
    line-height: 1;
  }
  .brand-divider {
    width: min(45vw, 240px);
    height: 1.5px;
    background: linear-gradient(90deg, transparent, rgba(245, 158, 11, 0.5), transparent);
    margin: min(2vh, 14px) 0;
  }
  .brand-tagline {
    font-size: min(2.6vw, 13px);
    font-weight: 700;
    letter-spacing: 0.28em;
    color: #FFA726;
    margin-left: 0.28em;
    text-transform: uppercase;
    opacity: 0.95;
  }
</style>
</head>
<body>
  <div class="splash-content">
    <div class="symbol-box">
      <div class="glow-aura"></div>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
        <defs>
          <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFE082" />
            <stop offset="50%" stop-color="#FFA726" />
            <stop offset="100%" stop-color="#E65100" />
          </linearGradient>

          <linearGradient id="facet-grad-1" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#FFB300" stop-opacity="0.22" />
            <stop offset="100%" stop-color="#FF6F00" stop-opacity="0.08" />
          </linearGradient>

          <linearGradient id="facet-grad-2" x1="80%" y1="0%" x2="20%" y2="100%">
            <stop offset="0%" stop-color="#FFE082" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#FF8F00" stop-opacity="0.06" />
          </linearGradient>

          <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFF9C4" />
            <stop offset="35%" stop-color="#FFD54F" />
            <stop offset="70%" stop-color="#FFA000" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#FF8F00" stop-opacity="0" />
          </radialGradient>

          <filter id="liturge-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <g filter="url(#liturge-glow)">
          <polygon points="100,22 148,68 100,46" fill="url(#facet-grad-1)" />
          <polygon points="100,22 52,68 100,46" fill="url(#facet-grad-2)" />
          <polygon points="100,46 128,84 100,100" fill="url(#facet-grad-2)" />
          <polygon points="100,46 72,84 100,100" fill="url(#facet-grad-1)" />
          <polygon points="100,100 128,116 100,154" fill="url(#facet-grad-1)" />
          <polygon points="100,100 72,116 100,154" fill="url(#facet-grad-2)" />
          <polygon points="28,62 72,84 52,68" fill="url(#facet-grad-1)" />
          <polygon points="172,62 128,84 148,68" fill="url(#facet-grad-2)" />
          <polygon points="28,138 72,116 52,132" fill="url(#facet-grad-2)" />
          <polygon points="172,138 128,116 148,132" fill="url(#facet-grad-1)" />
          <polygon points="100,178 52,132 100,154" fill="url(#facet-grad-1)" />
          <polygon points="100,178 148,132 100,154" fill="url(#facet-grad-2)" />

          <path d="M 100,22 L 148,68 L 172,62 L 148,132 L 172,138 L 100,178 L 52,132 L 28,138 L 52,68 L 28,62 Z" 
                stroke="url(#gold-grad)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

          <line x1="100" y1="22" x2="100" y2="46" stroke="url(#gold-grad)" stroke-width="1.5" stroke-linecap="round" />
          <line x1="100" y1="22" x2="28" y2="62" stroke="url(#gold-grad)" stroke-width="1.2" stroke-linecap="round" />
          <line x1="100" y1="22" x2="172" y2="62" stroke="url(#gold-grad)" stroke-width="1.2" stroke-linecap="round" />

          <line x1="100" y1="178" x2="100" y2="154" stroke="url(#gold-grad)" stroke-width="1.5" stroke-linecap="round" />
          <line x1="100" y1="178" x2="28" y2="138" stroke="url(#gold-grad)" stroke-width="1.2" stroke-linecap="round" />
          <line x1="100" y1="178" x2="172" y2="138" stroke="url(#gold-grad)" stroke-width="1.2" stroke-linecap="round" />

          <polygon points="100,46 148,68 148,132 100,154 52,132 52,68" 
                   stroke="url(#gold-grad)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />

          <line x1="28" y1="62" x2="72" y2="84" stroke="url(#gold-grad)" stroke-width="1.3" />
          <line x1="172" y1="62" x2="128" y2="84" stroke="url(#gold-grad)" stroke-width="1.3" />
          <line x1="28" y1="138" x2="72" y2="116" stroke="url(#gold-grad)" stroke-width="1.3" />
          <line x1="172" y1="138" x2="128" y2="116" stroke="url(#gold-grad)" stroke-width="1.3" />

          <line x1="52" y1="68" x2="128" y2="84" stroke="url(#gold-grad)" stroke-width="1.1" opacity="0.6" />
          <line x1="148" y1="68" x2="72" y2="84" stroke="url(#gold-grad)" stroke-width="1.1" opacity="0.6" />
          <line x1="52" y1="132" x2="128" y2="116" stroke="url(#gold-grad)" stroke-width="1.1" opacity="0.6" />
          <line x1="148" y1="132" x2="72" y2="116" stroke="url(#gold-grad)" stroke-width="1.1" opacity="0.6" />

          <polygon points="100,46 128,84 128,116 100,154 72,116 72,84" 
                   stroke="url(#gold-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

          <line x1="100" y1="100" x2="100" y2="46" stroke="url(#gold-grad)" stroke-width="1.6" />
          <line x1="100" y1="100" x2="128" y2="84" stroke="url(#gold-grad)" stroke-width="1.6" />
          <line x1="100" y1="100" x2="128" y2="116" stroke="url(#gold-grad)" stroke-width="1.6" />
          <line x1="100" y1="100" x2="100" y2="154" stroke="url(#gold-grad)" stroke-width="1.6" />
          <line x1="100" y1="100" x2="72" y2="116" stroke="url(#gold-grad)" stroke-width="1.6" />
          <line x1="100" y1="100" x2="72" y2="84" stroke="url(#gold-grad)" stroke-width="1.6" />

          <line x1="100" y1="46" x2="100" y2="154" stroke="url(#gold-grad)" stroke-width="1.1" opacity="0.5" stroke-dasharray="2 2" />
          <line x1="72" y1="84" x2="128" y2="116" stroke="url(#gold-grad)" stroke-width="1.1" opacity="0.4" />
          <line x1="72" y1="116" x2="128" y2="84" stroke="url(#gold-grad)" stroke-width="1.1" opacity="0.4" />

          <circle cx="100" cy="22" r="3.2" fill="#FFE082" />
          <circle cx="100" cy="22" r="5" fill="#FFA000" opacity="0.4" />
          <circle cx="28" cy="62" r="3" fill="#FFE082" />
          <circle cx="28" cy="62" r="4.5" fill="#FFA000" opacity="0.4" />
          <circle cx="172" cy="62" r="3" fill="#FFE082" />
          <circle cx="172" cy="62" r="4.5" fill="#FFA000" opacity="0.4" />
          <circle cx="28" cy="138" r="3" fill="#FFE082" />
          <circle cx="28" cy="138" r="4.5" fill="#FFA000" opacity="0.4" />
          <circle cx="172" cy="138" r="3" fill="#FFE082" />
          <circle cx="172" cy="138" r="4.5" fill="#FFA000" opacity="0.4" />
          <circle cx="100" cy="178" r="3.2" fill="#FFE082" />
          <circle cx="100" cy="178" r="5" fill="#FFA000" opacity="0.4" />

          <circle cx="52" cy="68" r="2.8" fill="#FFD54F" />
          <circle cx="148" cy="68" r="2.8" fill="#FFD54F" />
          <circle cx="52" cy="132" r="2.8" fill="#FFD54F" />
          <circle cx="148" cy="132" r="2.8" fill="#FFD54F" />

          <circle cx="100" cy="46" r="4" fill="#FFF9C4" />
          <circle cx="100" cy="46" r="6.5" fill="url(#node-glow)" opacity="0.8" />
          <circle cx="128" cy="84" r="4" fill="#FFF9C4" />
          <circle cx="128" cy="84" r="6.5" fill="url(#node-glow)" opacity="0.8" />
          <circle cx="128" cy="116" r="4" fill="#FFF9C4" />
          <circle cx="128" cy="116" r="6.5" fill="url(#node-glow)" opacity="0.8" />
          <circle cx="100" cy="154" r="4" fill="#FFF9C4" />
          <circle cx="100" cy="154" r="6.5" fill="url(#node-glow)" opacity="0.8" />
          <circle cx="72" cy="116" r="4" fill="#FFF9C4" />
          <circle cx="72" cy="116" r="6.5" fill="url(#node-glow)" opacity="0.8" />
          <circle cx="72" cy="84" r="4" fill="#FFF9C4" />
          <circle cx="72" cy="84" r="6.5" fill="url(#node-glow)" opacity="0.8" />

          <circle cx="100" cy="100" r="8" fill="url(#node-glow)" />
          <circle cx="100" cy="100" r="4.2" fill="#FFFFFF" />
        </g>
      </svg>
    </div>
    <div class="brand-title">LITURGE</div>
    <div class="brand-divider"></div>
    <div class="brand-tagline">Gestão de Escalas e Repertório</div>
  </div>
</body>
</html>
