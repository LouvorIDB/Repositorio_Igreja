<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 15px; color: #333; }
      h3 { margin-bottom: 20px; font-size: 18px; }
      button { 
        display: block; width: 100%; margin: 12px 0; padding: 12px; 
        cursor: pointer; border: none; border-radius: 6px; color: white; 
        font-weight: bold; font-size: 14px; transition: opacity 0.2s;
      }
      button:active { opacity: 0.7; }
      .domingo { background-color: #34a853; } /* Verde */
      .quarta { background-color: #4285f4; }  /* Azul */
      .sabado { background-color: #ea4335; }  /* Vermelho (Corrigido) */
      #loader { display: none; color: #666; margin-top: 10px; font-style: italic; }
    </style>
  </head>
  <body>
    <h3>Qual culto deseja gerar?</h3>
    
    <button class="domingo" onclick="selecionar('DOMINGO')">Domingo (6 músicas)</button>
    <button class="quarta" onclick="selecionar('QUARTA')">Quarta (4 músicas)</button>
    <button class="sabado" onclick="selecionar('SABADO')">Sábado (5 músicas)</button>

    <div id="loader">Processando... aguarde.</div>

    <script>
      function selecionar(tipo) {
        // Desabilita botões e mostra carregando
        document.querySelectorAll('button').forEach(btn => btn.style.display = 'none');
        document.getElementById('loader').style.display = 'block';

        google.script.run
          .withSuccessHandler(function() {
            google.script.host.close();
          })
          .withFailureHandler(function(err) {
            alert("Erro técnico: " + err.message);
            document.getElementById('loader').style.display = 'none';
            document.querySelectorAll('button').forEach(btn => btn.style.display = 'block');
          })
          .processarEscolha(tipo);
      }
    </script>
  </body>
</html>
